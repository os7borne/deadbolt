# Deadbolt — `xcodegen generate`, then open Deadbolt.xcodeproj. Never hand-edit the generated project.
name: Deadbolt
options:
  bundleIdPrefix: com.osborne.deadbolt
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  DeadboltCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 4CMN2DUGUL
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Deadbolt:
    type: application
    platform: iOS
    sources: [Apps/Shared, Apps/iOS]
    dependencies:
      - package: DeadboltCore
      - target: DeadboltAutoFill
        embed: true
    entitlements:
      path: Apps/iOS/Deadbolt.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.osborne.deadbolt]
        keychain-access-groups: [$(AppIdentifierPrefix)com.osborne.deadbolt.shared]
        aps-environment: development
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Deadbolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {UIColorName: ""}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Unlock your Deadbolt vault.
        NSCameraUsageDescription: Scan QR codes to link a new device or add a one-time code.
        UIBackgroundModes: [remote-notification]
        DeadboltKeychainGroup: $(DEVELOPMENT_TEAM).com.osborne.deadbolt.shared
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DeadboltAutoFill:
    type: app-extension
    platform: iOS
    sources: [Apps/Shared, Apps/iOSAutoFill]
    dependencies:
      - package: DeadboltCore
    entitlements:
      path: Apps/iOSAutoFill/DeadboltAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.osborne.deadbolt]
        keychain-access-groups: [$(AppIdentifierPrefix)com.osborne.deadbolt.shared]
    info:
      path: Apps/iOSAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Deadbolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock your Deadbolt vault.
        DeadboltKeychainGroup: $(DEVELOPMENT_TEAM).com.osborne.deadbolt.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              SupportsSavePasswordCredentials: true
              ProvidesOneTimeCodes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt.autofill
        TARGETED_DEVICE_FAMILY: "1"

  DeadboltBridge:
    type: tool
    platform: macOS
    sources: [Apps/Bridge]
    entitlements:
      path: Apps/Bridge/DeadboltBridge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [4CMN2DUGUL.com.osborne.deadbolt]
    info:
      path: Apps/Bridge/Info.plist
      properties:
        CFBundleIdentifier: com.osborne.deadbolt.bridge
        CFBundleName: deadbolt-bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: deadbolt-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt.bridge
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  DeadboltMacAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/macOSAutoFill
      - path: Apps/iOSAutoFill/AutoFillViews.swift
    dependencies:
      - package: DeadboltCore
    entitlements:
      path: Apps/macOSAutoFill/DeadboltMacAutoFill.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [4CMN2DUGUL.com.osborne.deadbolt]
        keychain-access-groups: [$(AppIdentifierPrefix)com.osborne.deadbolt.shared]
    info:
      path: Apps/macOSAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Deadbolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock your Deadbolt vault.
        DeadboltKeychainGroup: $(DEVELOPMENT_TEAM).com.osborne.deadbolt.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ShowsConfigurationUI: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt.autofill
        ENABLE_HARDENED_RUNTIME: YES

  DeadboltSafari:
    type: app-extension
    platform: macOS
    sources:
      - Apps/SafariExtension/SafariWebExtensionHandler.swift
      - Apps/Bridge/BridgeClient.swift
      - path: Apps/SafariExtension/Resources
        buildPhase: resources
    entitlements:
      path: Apps/SafariExtension/DeadboltSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [4CMN2DUGUL.com.osborne.deadbolt]
    info:
      path: Apps/SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Deadbolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt.safari
        ENABLE_HARDENED_RUNTIME: YES

  DeadboltMac:
    type: application
    platform: macOS
    sources: [Apps/Shared, Apps/macOS]
    dependencies:
      - package: DeadboltCore
      - package: Sparkle
      - target: DeadboltMacAutoFill
        embed: true
      - target: DeadboltSafari
        embed: true
      - target: DeadboltBridge
        embed: true
        codeSign: true
        copy:
          destination: executables
    entitlements:
      path: Apps/macOS/DeadboltMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [4CMN2DUGUL.com.osborne.deadbolt]
        # macOS lists an AutoFill provider in System Settings only if its host app carries this too (as the extension does).
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Writes Chrome's native-messaging host manifest. Fine for direct/TestFlight-internal; App Review would want another route.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Google/Chrome/NativeMessagingHosts/
          - /Library/Application Support/Google/Chrome Beta/NativeMessagingHosts/
          - /Library/Application Support/Google/Chrome Canary/NativeMessagingHosts/
          - /Library/Application Support/Chromium/NativeMessagingHosts/
          - /Library/Application Support/BraveSoftware/Brave-Browser/NativeMessagingHosts/
          - /Library/Application Support/Microsoft Edge/NativeMessagingHosts/
          - /Library/Application Support/Vivaldi/NativeMessagingHosts/
          - /Library/Application Support/Arc/User Data/NativeMessagingHosts/
          - /Library/Application Support/Yab/Chromium/NativeMessagingHosts/
          - /Library/Application Support/Aside/NativeMessagingHosts/
          - /Library/Application Support/com.ardia.browser/Chromium/NativeMessagingHosts/
        # Sparkle (self-updates): a sandboxed app can't replace itself, so it talks to Sparkle's installer and status XPC services.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        keychain-access-groups: [$(AppIdentifierPrefix)com.osborne.deadbolt.shared]
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Deadbolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSFaceIDUsageDescription: Unlock your Deadbolt vault.
        DeadboltKeychainGroup: $(DEVELOPMENT_TEAM).com.osborne.deadbolt.shared
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle: EdDSA-signed zips from the website, checked hourly, installed at a quiet moment (Settings › General › Updates).
        # The private key is in the owner's login Keychain (account "deadbolt"); see scripts/release-mac.sh.
        SUFeedURL: https://deadbolt.osborne.vc/updates/appcast.xml
        SUPublicEDKey: ewsqbiqfP/23fu5OKPNNp9tR8O2T1Vd7AW8cfe5XEHA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osborne.deadbolt
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: Deadbolt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
