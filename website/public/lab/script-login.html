<body><div class="wrap">

<h1>2 · Script sign-in, no form</h1>
<div class="expect"><b>Expected:</b> no &lt;form&gt; and no page change — after <i>Continue</i> the fields disappear and,
about two seconds later, Deadbolt offers to save.</div>
<div class="card" id="box">
  <label for="u">Username</label><input id="u" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="row"><div role="button" tabindex="0" class="btn" id="go">Continue</div></div>
</div>
<script>
document.getElementById("go").onclick = async () => {
  await new Promise((r) => setTimeout(r, 400)); // pretend network
  document.getElementById("box").outerHTML = '<div class="banner">✓ Signed in (pretend) — no page change</div>';
};
</script>
</div></body></html>
