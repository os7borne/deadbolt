<h1>5 · Redirect to another subdomain</h1>
<div class="expect"><b>Expected:</b> you're on <code id="here"></code>. After signing in you land on
<code>deadbolt.osborne.vc</code> — same site (<code>osborne.vc</code>), different subdomain — and Deadbolt offers to save there.</div>
<form class="card" onsubmit="event.preventDefault(); setTimeout(() => location.href = 'https://deadbolt.osborne.vc/lab/welcome.html?case=redirect', 150)">
  <label for="u">Email</label><input id="u" type="email" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="row"><button type="submit">Sign in</button></div>
</form>
<script>document.getElementById("here").textContent = location.hostname;</script>
</div></body></html>
