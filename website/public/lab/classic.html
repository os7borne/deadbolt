<h1>1 · Classic form</h1>
<div class="expect"><b>Expected:</b> the fill menu appears under the fields (Chrome/Aside) or system AutoFill offers Deadbolt (Safari).
After <i>Sign in</i>, the next page shows a <b>Save to Deadbolt?</b> card, or <b>Update</b> if this username is already saved with another password.</div>
<form class="card" action="welcome.html" method="get" onsubmit="event.preventDefault(); setTimeout(() => location.href = 'welcome.html?case=classic', 150)">
  <label for="u">Email</label><input id="u" name="username" type="email" autocomplete="username">
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
  <div class="row"><button type="submit">Sign in</button></div>
</form>
